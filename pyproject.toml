[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-index-rebalancer"
version = "0.1.0"
description = "Auditable equal-weight crypto index composition at month-end"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["tzdata>=2025.2; platform_system == 'Windows'"]

[project.scripts]
crypto-index = "crypto_index.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
crypto_index = ["dashboard.html"]

[project.optional-dependencies]
reports = ["matplotlib>=3.8,<4"]
